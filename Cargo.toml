[profile.release]
panic = "abort"


[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[package]
name = "chaos"
version = "0.1.0"
edition = "2024"

# [package.metadata.bootimage]
# build-command = ["build"]
# run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}"]

[dependencies]
bootloader_api = "0.11.10"
# bootloader = "0.11.10"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
# once_cell = { version = "1.20.3", default-features = false, features = ["alloc"] }
panic-halt = "0.2.0"
pic8259 = "0.11.0"
raw-cpuid = "11.4.0"
rlibc = "1.0.0"
spin = "0.9.8"
volatile = "0.4.6"
x86_64 = "0.15.2"
